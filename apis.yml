x-coverage:
  state: gated
  reason: partner-login
  detail: >-
    Evolve ships no developer portal at all, and the two API surfaces that do exist are
    reachable only with an owner credential — a POST introspection query to
    owner.evolve.com/graphql 307s to /login/idp, and api.evolve.com (an AWS API Gateway)
    answers ForbiddenException on every path including /openapi.json and every
    /.well-known/ path — so the only anonymous machine-readable document on any Evolve
    host is the Salesforce Experience Cloud OIDC discovery doc at help.evolve.com.
  evidence:
  - url: https://owner.evolve.com/graphql
    status: 307
  - url: https://api.evolve.com/openapi.json
    status: 403
  - url: https://help.evolve.com/.well-known/openid-configuration
    status: 200
  - url: https://evolve.com/llms.txt
    status: 200
